<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Castle defense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=21" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="app">
      <canvas id="view"></canvas>
      <div id="crosshair" class="crosshair" hidden>
        <i class="n"></i><i class="s"></i><i class="w"></i><i class="e"></i>
        <span id="aim-tool" class="aim-tool" hidden></span>
      </div>
      <p id="look-prompt" class="look-prompt" hidden></p>

      <header class="hud top">
        <div class="hud-row">
          <div class="meters">
            <div class="meter gold" title="Gold">
              <span>Gold</span>
              <strong id="gold">360</strong>
              <small id="gold-cap"></small>
            </div>
            <div class="meter army" title="Army">
              <span>Army</span>
              <div class="hp-track army-hp"><i id="army-fill"></i></div>
              <strong id="army">0/0</strong>
            </div>
            <div class="meter wave" title="Wave">
              <span>Wave</span>
              <strong id="wave">—</strong>
            </div>
            <div class="meter stronghold" title="Click to upgrade the keep" id="keep-meter">
              <span>Keep</span>
              <div class="hp-track"><i id="keep-fill"></i></div>
              <strong id="keep-hp">400</strong>
            </div>
          </div>
          <div class="hud-actions">
            <button type="button" id="btn-settings" class="ghost">Settings</button>
            <button type="button" id="btn-start" class="go">Start waves</button>
          </div>
        </div>
      </header>
      <nav id="hotbar" class="hud hotbar" aria-label="Buildings"></nav>
      <p id="hint" class="toast" hidden></p>

      <aside id="inspect" class="inspect" hidden>
        <p id="inspect-title" class="inspect-title">Building</p>
        <p id="inspect-meta" class="inspect-meta"></p>
        <div id="inspect-actions" class="inspect-actions"></div>
      </aside>

      <div id="menu" class="overlay">
        <div class="card slim">
          <p class="kicker">Wave defense</p>
          <h2>Castle defense</h2>
          <button type="button" id="btn-play" class="go">Play</button>
        </div>
      </div>

      <div id="settings" class="overlay" hidden>
        <div class="card slim">
          <p class="kicker">Options</p>
          <h2>Settings</h2>
          <div class="settings-row">
            <span>Audio</span>
            <button type="button" id="btn-mute" class="ghost">Mute</button>
          </div>
          <button type="button" id="btn-settings-close" class="go">Close</button>
        </div>
      </div>

      <div id="end" class="overlay" hidden>
        <div class="card">
          <p id="end-kicker" class="kicker">Match over</p>
          <h2 id="end-title">Victory</h2>
          <p id="end-body">You held the meadow.</p>
          <button type="button" id="btn-restart" class="go">Restart</button>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener("error", (event) => {
        const hint = document.getElementById("hint");
        if (hint) {
          hint.hidden = false;
          hint.textContent = event.message || "Something failed to load.";
        }
        document.documentElement.dataset.gk = "error";
      });
    </script>
    <script type="module" src="js/game.js?v=25"></script>
  </body>
</html>
